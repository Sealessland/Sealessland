<svg width="920" height="280" viewBox="0 0 920 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sealessland RPG Player Card</title>
  <desc id="desc">A playful terminal-style player card for Sealessland.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101018"/>
      <stop offset="0.45" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#241033"/>
    </linearGradient>
    <linearGradient id="neon" x1="28" y1="0" x2="892" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5D4"/>
      <stop offset="0.5" stop-color="#FEE440"/>
      <stop offset="1" stop-color="#F15BB5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="920" height="280" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="920" height="280" rx="28" fill="url(#grid)"/>
  <rect x="10" y="10" width="900" height="260" rx="22" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>

  <circle cx="805" cy="55" r="4" fill="#00F5D4">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="835" cy="55" r="4" fill="#FEE440">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="865" cy="55" r="4" fill="#F15BB5">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="42" y="62" fill="#9BF6FF" font-size="18">$ ./summon --player sealessland</text>
    <text x="42" y="102" fill="#FFFFFF" font-size="34" font-weight="700">SEALESSLAND.EXE</text>
    <text x="42" y="132" fill="#C3F8FF" font-size="17">CLASS: EE student @ UESTC  //  MODE: senior-year ZuoTiJia</text>
    <text x="42" y="160" fill="#FFC6FF" font-size="16">MISSION: become a computer scientist without losing curiosity</text>

    <text x="42" y="208" fill="#FEE440" font-size="16">QUESTS</text>
    <text x="42" y="234" fill="#E6E6F0" font-size="15">[x] collect bugs   [ ] ship real things   [ ] make circuits behave   [ ] touch grass</text>

    <text x="535" y="104" fill="#FEE440" font-size="16">ATTRIBUTES</text>
    <text x="535" y="133" fill="#E6E6F0" font-size="15">Curiosity</text>
    <rect x="640" y="120" width="200" height="16" rx="8" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="640" y="120" width="188" height="16" rx="8" fill="#00F5D4"/>

    <text x="535" y="166" fill="#E6E6F0" font-size="15">Debugging</text>
    <rect x="640" y="153" width="200" height="16" rx="8" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="640" y="153" width="158" height="16" rx="8" fill="#F15BB5"/>

    <text x="535" y="199" fill="#E6E6F0" font-size="15">Sleep</text>
    <rect x="640" y="186" width="200" height="16" rx="8" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="640" y="186" width="46" height="16" rx="8" fill="#FEE440"/>

    <text x="535" y="234" fill="#9BF6FF" font-size="15">PET: contribution snake  //  DROP RATE: AC or mystery error</text>
  </g>
</svg>
