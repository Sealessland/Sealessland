<svg width="920" height="250" viewBox="0 0 920 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sealessland terminal profile card</title>
  <desc id="desc">A restrained terminal-style profile card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0F1E36"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="24" y1="0" x2="896" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="920" height="250" rx="18" fill="url(#bg)"/>
  <rect width="920" height="250" rx="18" fill="url(#grid)"/>
  <rect x="12" y="12" width="896" height="226" rx="14" stroke="url(#accent)" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="40" y="50" fill="#93C5FD" font-size="16">sealessland@github:~$ profile --brief</text>
    <text x="40" y="90" fill="#F9FAFB" font-size="30" font-weight="700">SEALESSLAND</text>
    <text x="40" y="120" fill="#D1D5DB" font-size="16">Electrical Engineering @ UESTC</text>
    <text x="40" y="148" fill="#CBD5E1" font-size="15">Algorithms · systems · engineering practice</text>

    <text x="40" y="194" fill="#60A5FA" font-size="14">CURRENT</text>
    <text x="40" y="220" fill="#E5E7EB" font-size="15">implementation practice / technical notes / experiments</text>

    <text x="560" y="90" fill="#60A5FA" font-size="14">AREAS</text>

    <text x="560" y="120" fill="#E5E7EB" font-size="14">Algorithms</text>
    <rect x="690" y="109" width="150" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="690" y="109" width="120" height="12" rx="6" fill="#38BDF8"/>

    <text x="560" y="152" fill="#E5E7EB" font-size="14">Systems</text>
    <rect x="690" y="141" width="150" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="690" y="141" width="88" height="12" rx="6" fill="#60A5FA"/>

    <text x="560" y="184" fill="#E5E7EB" font-size="14">EE</text>
    <rect x="690" y="173" width="150" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="690" y="173" width="102" height="12" rx="6" fill="#818CF8"/>

    <text x="560" y="220" fill="#94A3B8" font-size="13">format: terminal card / restrained motion</text>
  </g>

  <circle cx="832" cy="47" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="854" cy="47" r="4" fill="#60A5FA">
    <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="876" cy="47" r="4" fill="#818CF8">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
